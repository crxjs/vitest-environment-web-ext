name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vitest: [3.2.7, 4.0.18]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm add -D vitest@${{ matrix.vitest }} --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/firefox.mjs install --with-deps
      - run: node node_modules/playwright/cli.js install --with-deps --no-shell chromium
      - run: pnpm test
